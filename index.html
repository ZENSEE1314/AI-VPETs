<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pet World</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-left">
        <span class="tag">🪙 <b id="hud-gold">0</b></span>
        <span class="tag">📅 Day <b id="hud-day">1</b></span>
        <span class="tag">⏰ <b id="hud-time">08:00</b></span>
        <span class="tag">📍 <b id="hud-zone">World</b></span>
      </div>
      <div class="hud-right">
        <span class="pet" id="hud-pet">No pet yet</span>
        <button id="btn-pet" title="P">Pet</button>
        <button id="btn-roster" title="R">Roster</button>
        <button id="btn-dex" title="X">Dex</button>
        <button id="btn-bag" title="I">Bag</button>
        <button id="btn-costume">Costume</button>
        <button id="btn-admin" title="F2">Admin</button>
        <button id="btn-help">?</button>
        <button id="btn-save">Save</button>
      </div>
    </header>

    <main id="stage">
      <canvas id="game" width="960" height="720"></canvas>
      <aside id="sidebar">
        <section id="pet-panel" class="panel">
          <h3>Pet</h3>
          <div id="pet-card">Visit the Pet Shop to hire a free starter pet.</div>
        </section>
        <section id="log-panel" class="panel">
          <h3>Log</h3>
          <ul id="log"></ul>
        </section>
      </aside>
    </main>

    <div id="dialog-root"></div>
    <div id="toast-root"></div>

    <footer id="controls">
      <span><b>Move</b>: WASD / Arrows</span>
      <span><b>Interact / Attack</b>: E or Space</span>
      <span><b>Catch</b>: C</span>
      <span><b>Bag</b>: I · <b>Pet</b>: P · <b>Roster</b>: R · <b>Dex</b>: X · <b>Admin</b>: F2</span>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/market.js"></script>
  <script src="js/forge.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/world.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
